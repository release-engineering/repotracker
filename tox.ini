[tox]
requires =
    tox>=4
env_list = lint, py314

[gh]
python =
    3.14 = py314, lint, cov

[pytest]
minversion = 7.0
testpaths = tests

[testenv]
description = install pytest in a virtual environment and invoke it on the tests folder
deps =
    pytest>=7
commands = pytest {posargs}

[testenv:cov]
deps =
    pytest-cov
commands = pytest --cov --cov-report=term-missing --cov-fail-under=90 {posargs}

[testenv:lint]
deps =
    flake8
    black
skip_install = true
commands =
    flake8 .
    black . --check --diff -t py314

[flake8]
# E722 do not use bare 'except'
# E203 compatibility with black
extend-ignore = E203,E722
max-line-length = 120
exclude = .git,venv*,.tox,.eggs,build

[testenv:black]
description = run linters
skip_install = true
deps =
    black
commands = black {posargs:.}

[testenv:pip-compile]
description = generate requirements.txt from dependencies specified in pyproject.toml
basepython = python314
skip_install = true
deps = pip-tools
commands =
    pip-compile --generate-hashes --strip-extras {posargs}
